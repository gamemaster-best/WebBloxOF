<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBlox - Physics & Avatar Update</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff00;
            --bg: #1a1a1a;
            --header-bg: #111;
            --card-bg: #2d2d2d;
            --accent: #4285F4;
            --red: #f44;
            --tab-inactive: #666;
            --studio-panel: #252526;
            --studio-border: #3c3c3c;
        }

        body, html {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }

        .retro-font { font-family: 'Press Start 2P', cursive; }

        header {
            background: var(--header-bg);
            border-bottom: 2px solid #333;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2000;
            height: 95px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
        }

        .nav-tabs {
            display: flex;
            background: #1e1e1e;
            padding: 0 20px;
            gap: 5px;
        }

        .tab-btn {
            padding: 12px 15px;
            font-size: 0.6rem;
            color: var(--tab-inactive);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 3px solid transparent;
            font-family: 'Press Start 2P', cursive;
        }

        .tab-btn.active {
            color: white;
            border-bottom-color: var(--primary);
            background: #2d2d2d;
        }

        #game-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        .ui-layer {
            position: absolute;
            top: 95px; left: 0; width: 100%; height: calc(100% - 95px);
            z-index: 1000;
            pointer-events: none;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            background: transparent;
        }

        .opaque-bg { 
            background-color: var(--bg); 
            pointer-events: auto; 
            z-index: 1500;
        }
        
        .hidden { display: none !important; }

        #tab-create { flex-direction: row; }
        .studio-sidebar {
            width: 280px;
            background: var(--studio-panel);
            border-right: 1px solid var(--studio-border);
            display: flex;
            flex-direction: column;
            font-size: 0.75rem;
            pointer-events: auto;
        }
        .panel-header {
            padding: 10px;
            background: #333;
            font-weight: bold;
            font-size: 0.65rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--studio-border);
        }
        .explorer-list { flex: 1; overflow-y: auto; background: #1e1e1e; }
        .explorer-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #2a2a2a; transition: 0.1s; }
        .explorer-item.selected { background: var(--accent); color: white; }

        .properties-panel { height: 350px; border-top: 2px solid var(--studio-border); padding: 15px; background: var(--studio-panel); overflow-y: auto; }
        .prop-group { margin-bottom: 12px; }
        .prop-label { font-size: 0.6rem; color: #888; display: block; margin-bottom: 4px; }
        .prop-input { background: #111; border: 1px solid #444; color: white; padding: 4px; width: 100%; font-size: 0.7rem; box-sizing: border-box; }

        .main-content { padding: 30px; overflow-y: auto; width: 100%; pointer-events: auto; }
        .btn-action {
            font-family: 'Press Start 2P', cursive;
            padding: 8px 12px; cursor: pointer; border: 2px solid white;
            background: var(--accent); color: white; border-radius: 4px;
            font-size: 0.55rem;
        }
        .btn-red { background: var(--red); }
        .btn-green { background: var(--primary); color: black; border-color: black; }

        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .game-card { background: var(--card-bg); border-radius: 8px; padding: 15px; border: 2px solid #444; cursor: pointer; transition: 0.2s; text-align: center;}
        .game-card:hover { border-color: var(--primary); transform: scale(1.02); }

        #screen-game-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; pointer-events: none; }
        #exit-game-btn { position: absolute; top: 20px; left: 20px; pointer-events: auto; }
        
        .studio-controls-hint {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 4px;
            font-size: 0.6rem; color: #aaa; pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <header id="main-header">
        <div class="top-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="background:var(--red); padding:5px; border:2px solid white; font-weight:bold;" class="retro-font">W</div>
                <span class="retro-font" style="font-size:0.8rem;">WEBBLOX</span>
            </div>
            <div id="auth-status" class="retro-font" style="font-size:0.5rem; color:var(--primary);">Connecting...</div>
        </div>
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="home">HOME</button>
            <button class="tab-btn" data-tab="games">GAMES</button>
            <button class="tab-btn" data-tab="avatar">AVATAR</button>
            <button class="tab-btn" data-tab="create">STUDIO</button>
        </nav>
    </header>

    <div class="ui-layer" id="ui-container">
        <div id="tab-home" class="screen opaque-bg">
            <div class="main-content">
                <h2 class="retro-font" style="font-size:1rem;">Dashboard</h2>
                <div id="home-featured" class="game-grid"></div>
            </div>
        </div>

        <div id="tab-games" class="screen opaque-bg hidden">
            <div class="main-content">
                <h2 class="retro-font" style="font-size:1rem;">Discover</h2>
                <div id="games-list" class="game-grid"></div>
            </div>
        </div>

        <div id="tab-avatar" class="screen hidden">
             <div style="width: 280px; background: rgba(0,0,0,0.8); height: 100%; pointer-events: auto; padding: 20px; border-right: 1px solid #444;">
                <h2 class="retro-font" style="font-size:0.6rem;">Customize</h2>
                <p class="retro-font" style="font-size:0.4rem; color: #888; margin-top:20px;">Select Skin Color</p>
                <div id="skin-tones" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom:20px;"></div>
                <button class="btn-action" style="width:100%" onclick="window.saveAvatar()">SAVE AVATAR</button>
             </div>
        </div>

        <div id="tab-create" class="screen hidden">
            <div class="studio-sidebar">
                <div class="panel-header">Explorer</div>
                <div class="explorer-list" id="explorer-list"></div>
                <div class="properties-panel" id="properties-window">
                    <div id="prop-content">Select an object</div>
                </div>
            </div>
            <div style="flex:1; pointer-events:none; position:relative;">
                <div style="position:absolute; top:10px; left:10px; pointer-events:auto; display:flex; gap:10px;">
                    <button class="btn-action" onclick="window.studioAdd('Part')">+ Part</button>
                    <button class="btn-action" onclick="window.studioAdd('Wedge')">+ Wedge</button>
                    <button class="btn-action btn-green" onclick="window.publishGame()">PUBLISH</button>
                    <button class="btn-action btn-red" onclick="window.exitGame()">QUIT STUDIO</button>
                </div>
                <div class="studio-controls-hint">
                    W: Move | E: Rotate | R: Scale
                </div>
            </div>
        </div>
    </div>

    <div id="screen-game-ui" class="hidden">
        <div id="exit-game-btn">
            <div style="background:rgba(0,0,0,0.9); padding:20px; border-radius:8px; border:2px solid #444;">
                <p id="active-game-name" class="retro-font" style="font-size:0.7rem; color:var(--primary); margin:0 0 15px 0;"></p>
                <button class="btn-action btn-red" style="width:100%;" onclick="window.exitGame()">QUIT GAME</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136/examples/jsm/controls/OrbitControls.js';
        import { TransformControls } from 'https://cdn.skypack.dev/three@0.136/examples/jsm/controls/TransformControls.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'webblox-v4';

        let scene, camera, renderer, controls, player, userId;
        let currentMode = 'home'; 
        let studioObjects = [];
        let physicalObjects = []; // Used for hitboxes
        let selectedIdx = -1;
        let avatarColor = 0x0077ff;
        const keys = {};

        // Physics State
        let playerVelocity = new THREE.Vector3();
        let isGrounded = false;
        const GRAVITY = -0.015;
        const JUMP_FORCE = 0.45;
        const PLAYER_SPEED = 0.15;

        function initEngine() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('game-canvas'), 
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2.1; // Limit camera from going underground

            window.transformControls = new TransformControls(camera, renderer.domElement);
            window.transformControls.addEventListener('dragging-changed', (event) => {
                controls.enabled = !event.value;
                if (!event.value) updatePropertiesUI();
            });
            scene.add(window.transformControls);

            setupLights();
            requestAnimationFrame(animate);
        }

        function setupLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            scene.add(sun);
        }

        function clearScene() {
            if(window.transformControls) window.transformControls.detach();
            while(scene.children.length > 0) {
                const child = scene.children[0];
                if (child === window.transformControls) {
                    scene.remove(child);
                    continue;
                }
                scene.remove(child);
            }
            physicalObjects = [];
            if(window.transformControls) scene.add(window.transformControls);
            setupLights();
        }

        function buildBaseplate() {
            const geo = new THREE.BoxGeometry(400, 2, 400);
            const mat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
            const plate = new THREE.Mesh(geo, mat);
            plate.position.y = -1;
            plate.receiveShadow = true;
            plate.userData.isFloor = true;
            scene.add(plate);
            physicalObjects.push(plate);
            scene.add(new THREE.GridHelper(400, 40, 0x00ff00, 0x222222));
        }

        function spawnPlayer(color = avatarColor) {
            player = new THREE.Group();
            const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.5), new THREE.MeshStandardMaterial({color}));
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({color: 0xffdbac}));
            head.position.y = 0.9;
            player.add(torso, head);
            player.position.set(0, 1.1, 0);
            scene.add(player);
            controls.target.copy(player.position);
            playerVelocity.set(0,0,0);
        }

        window.setMode = (mode, data = null) => {
            currentMode = mode;
            clearScene();
            
            const header = document.getElementById('main-header');
            const uiContainer = document.getElementById('ui-container');
            const gameUi = document.getElementById('screen-game-ui');
            
            header.classList.remove('hidden');
            uiContainer.classList.remove('hidden');
            uiContainer.style.top = "95px";
            uiContainer.style.height = "calc(100% - 95px)";
            
            if (mode === 'home' || mode === 'games') {
                scene.background = new THREE.Color(0x000000);
                gameUi.classList.add('hidden');
            } 
            else if (mode === 'avatar') {
                scene.background = new THREE.Color(0x1a1a1a);
                gameUi.classList.add('hidden');
                spawnPlayer(avatarColor);
                camera.position.set(0, 1.5, 5);
                controls.target.set(0, 1, 0);
            } 
            else if (mode === 'studio') {
                scene.background = new THREE.Color(0x87CEEB);
                header.classList.add('hidden');
                uiContainer.style.top = "0px";
                uiContainer.style.height = "100%";
                gameUi.classList.add('hidden');
                buildBaseplate();
                studioObjects.forEach(obj => {
                    scene.add(obj);
                    physicalObjects.push(obj);
                });
                camera.position.set(20, 20, 20);
                controls.target.set(0,0,0);
                updateExplorer();
            } 
            else if (mode === 'game') {
                scene.background = new THREE.Color(0x87CEEB);
                header.classList.add('hidden');
                uiContainer.classList.add('hidden');
                gameUi.classList.remove('hidden');
                buildBaseplate();
                
                if(data?.id === 'obby') {
                    for(let i=0; i<15; i++) {
                        const p = new THREE.Mesh(new THREE.BoxGeometry(5, 0.5, 5), new THREE.MeshStandardMaterial({color: 0x00ff00}));
                        p.position.set(0, i * 2, -i * 6);
                        scene.add(p);
                        physicalObjects.push(p);
                    }
                } else if(data?.id === 'published') {
                    studioObjects.forEach(obj => {
                        const clone = obj.clone();
                        scene.add(clone);
                        physicalObjects.push(clone);
                    });
                }
                
                spawnPlayer(avatarColor);
                camera.position.set(0, 10, 15);
            }
        };

        window.studioAdd = (type) => {
            const geo = type === 'Part' ? new THREE.BoxGeometry(4,4,4) : new THREE.CylinderGeometry(0, 4, 4, 4);
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: 0xcccccc}));
            mesh.position.set(0, 2, 0);
            mesh.userData.name = `${type} ${studioObjects.length + 1}`;
            studioObjects.push(mesh);
            physicalObjects.push(mesh);
            scene.add(mesh);
            updateExplorer();
            selectObject(studioObjects.length - 1);
        };

        function updateExplorer() {
            const list = document.getElementById('explorer-list');
            if(!list) return;
            list.innerHTML = "";
            studioObjects.forEach((obj, i) => {
                const item = document.createElement('div');
                item.className = `explorer-item ${selectedIdx === i ? 'selected' : ''}`;
                item.textContent = "📦 " + obj.userData.name;
                item.onclick = (e) => { e.stopPropagation(); selectObject(i); };
                list.appendChild(item);
            });
        }

        function selectObject(idx) {
            selectedIdx = idx;
            const obj = studioObjects[idx];
            updateExplorer();
            if(obj && window.transformControls) window.transformControls.attach(obj);
            else if(window.transformControls) window.transformControls.detach();
            updatePropertiesUI();
        }

        function updatePropertiesUI() {
            const prop = document.getElementById('prop-content');
            const obj = studioObjects[selectedIdx];
            if(!obj) { prop.innerHTML = "Select an object"; return; }
            prop.innerHTML = `
                <div class="prop-group"><span class="prop-label">Name</span><input class="prop-input" value="${obj.userData.name}" onchange="window.updateObjProp('name', this.value)"></div>
                <div class="prop-group"><span class="prop-label">Color</span><input class="prop-input" type="color" value="#${obj.material.color.getHexString()}" oninput="window.updateObjProp('color', this.value)"></div>
                <div class="prop-group">
                    <span class="prop-label">Transform Mode</span>
                    <div style="display:flex; gap:5px;">
                        <button class="btn-action" style="flex:1; font-size:0.4rem;" onclick="window.transformControls.setMode('translate')">MOVE</button>
                        <button class="btn-action" style="flex:1; font-size:0.4rem;" onclick="window.transformControls.setMode('rotate')">ROT</button>
                        <button class="btn-action" style="flex:1; font-size:0.4rem;" onclick="window.transformControls.setMode('scale')">SCALE</button>
                    </div>
                </div>
                <button class="btn-action btn-red" style="width:100%; margin-top:20px;" onclick="window.studioDelete()">DELETE</button>
            `;
        }

        window.updateObjProp = (prop, val) => {
            const obj = studioObjects[selectedIdx];
            if(!obj) return;
            if(prop === 'name') { obj.userData.name = val; updateExplorer(); }
            if(prop === 'color') obj.material.color.set(val);
        };

        window.studioDelete = () => {
            if(selectedIdx === -1) return;
            if(window.transformControls) window.transformControls.detach();
            scene.remove(studioObjects[selectedIdx]);
            studioObjects.splice(selectedIdx, 1);
            physicalObjects = physicalObjects.filter(o => o !== studioObjects[selectedIdx]);
            selectedIdx = -1;
            updateExplorer();
            updatePropertiesUI();
        };

        window.saveAvatar = async () => {
            if(!userId || !player) return;
            avatarColor = player.children[0].material.color.getHex();
            await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'data', 'profile'), { torsoColor: avatarColor }, { merge: true });
            alert("Avatar Saved!");
        };

        window.publishGame = async () => {
            if(!userId) return;
            const data = studioObjects.map(o => ({
                pos: [o.position.x, o.position.y, o.position.z],
                rot: [o.rotation.x, o.rotation.y, o.rotation.z],
                scale: [o.scale.x, o.scale.y, o.scale.z],
                color: o.material.color.getHex(),
                name: o.userData.name
            }));
            await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'data', 'studio_save'), { map: data });
            alert("Map Published!");
        };

        window.exitGame = () => {
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('screen-game-ui').classList.add('hidden');
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('tab-home').classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-tab="home"]').classList.add('active');
            window.setMode('home');
        };

        // --- PHYSICS & COLLISION ---
        function checkCollision(pos) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(0.8, 2.2, 0.8));
            for (let obj of physicalObjects) {
                const objBox = new THREE.Box3().setFromObject(obj);
                if (playerBox.intersectsBox(objBox)) {
                    // Check if it's a floor collision or a wall collision
                    const overlapY = Math.min(playerBox.max.y, objBox.max.y) - Math.max(playerBox.min.y, objBox.min.y);
                    const overlapX = Math.min(playerBox.max.x, objBox.max.x) - Math.max(playerBox.min.x, objBox.min.x);
                    const overlapZ = Math.min(playerBox.max.z, objBox.max.z) - Math.max(playerBox.min.z, objBox.min.z);

                    if (overlapY < overlapX && overlapY < overlapZ) {
                        return { type: 'floor', obj };
                    } else {
                        return { type: 'wall', obj };
                    }
                }
            }
            return null;
        }

        function updatePlayerPhysics() {
            if (!player) return;

            // Gravity
            playerVelocity.y += GRAVITY;
            let nextPos = player.position.clone().add(new THREE.Vector3(0, playerVelocity.y, 0));
            let hit = checkCollision(nextPos);

            if (hit && hit.type === 'floor' && playerVelocity.y <= 0) {
                playerVelocity.y = 0;
                isGrounded = true;
            } else {
                player.position.y += playerVelocity.y;
                isGrounded = false;
            }

            // Movement (Roblox Style - Camera Relative)
            let moveDir = new THREE.Vector3();
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();

            if (keys['KeyW']) moveDir.add(forward);
            if (keys['KeyS']) moveDir.add(forward.clone().negate());
            if (keys['KeyA']) moveDir.add(right.clone().negate());
            if (keys['KeyD']) moveDir.add(right);

            if (moveDir.length() > 0) {
                moveDir.normalize().multiplyScalar(PLAYER_SPEED);
                const nextMovePos = player.position.clone().add(moveDir);
                const wallHit = checkCollision(nextMovePos);
                if (!wallHit || wallHit.type === 'floor') {
                    player.position.add(moveDir);
                }
                
                // Rotate player to face move direction
                const targetRotation = Math.atan2(moveDir.x, moveDir.z);
                player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, targetRotation, 0.2);
            }

            // Respawn if fell
            if (player.position.y < -20) {
                player.position.set(0, 5, 0);
                playerVelocity.set(0,0,0);
            }

            controls.target.lerp(player.position, 0.2);
        }

        window.onload = async () => {
            initEngine();
            window.setMode('home');

            try {
                const cred = await signInAnonymously(auth);
                userId = cred.user.uid;
                document.getElementById('auth-status').textContent = `CONNECTED`;
                
                // Load Avatar Profile
                const profile = await getDoc(doc(db, 'artifacts', appId, 'users', userId, 'data', 'profile'));
                if(profile.exists()) {
                    avatarColor = profile.data().torsoColor || 0x0077ff;
                }
            } catch(e) {
                document.getElementById('auth-status').textContent = "OFFLINE";
                userId = "guest";
            }

            const games = [
                { id: 'obby', name: 'Standard Obby', icon: '🏁' },
                { id: 'published', name: 'My Map', icon: '🛠️' }
            ];

            const renderCards = (container) => {
                games.forEach(g => {
                    const card = document.createElement('div');
                    card.className = "game-card";
                    card.innerHTML = `<div style="font-size:3rem; margin-bottom:10px;">${g.icon}</div><div class="retro-font" style="font-size:0.5rem;">${g.name}</div>`;
                    card.onclick = () => {
                        document.getElementById('active-game-name').textContent = g.name;
                        window.setMode('game', g);
                    };
                    container.appendChild(card);
                });
            };
            renderCards(document.getElementById('home-featured'));
            renderCards(document.getElementById('games-list'));

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
                    const tabId = btn.getAttribute('data-tab');
                    document.getElementById(`tab-${tabId}`).classList.remove('hidden');
                    window.setMode(tabId);
                };
            });

            [0xf1c27d, 0xe0ac69, 0x8d5524, 0x0077ff, 0xff0000, 0x00ff00].forEach(c => {
                const tone = document.createElement('div');
                tone.style.width = '100%'; tone.style.aspectRatio = '1/1'; tone.style.backgroundColor = `#${c.toString(16).padStart(6,'0')}`;
                tone.style.cursor = 'pointer'; tone.style.border = '2px solid white';
                tone.onclick = () => { if(player) player.children[0].material.color.set(c); };
                document.getElementById('skin-tones').appendChild(tone);
            });
        };

        window.onkeydown = (e) => {
            keys[e.code] = true;
            if(currentMode === 'studio' && window.transformControls) {
                if(e.code === 'KeyW') window.transformControls.setMode('translate');
                if(e.code === 'KeyE') window.transformControls.setMode('rotate');
                if(e.code === 'KeyR') window.transformControls.setMode('scale');
            }
            if(e.code === 'Space' && isGrounded && currentMode === 'game') {
                playerVelocity.y = JUMP_FORCE;
            }
        };
        window.onkeyup = (e) => keys[e.code] = false;

        function animate() {
            requestAnimationFrame(animate);
            if (currentMode !== 'home' && currentMode !== 'games') {
                if(currentMode === 'game') {
                    updatePlayerPhysics();
                }
                controls.update();
                renderer.render(scene, camera);
            }
        }
        
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
